[project]
name = "template-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "fastapi[standard]>=0.136.1",
    "greenlet>=3.5.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "sqlmodel>=0.0.38",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "ty>=0.0.32",
    "ruff>=0.15.12",
    "pre-commit>=4.6.0",
    "python-dotenv>=1.2.1",
    "notebook>=7.5.5",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ipython>=9.12.0",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    ".venv",
    ".pytest_cache",
    "migrations",
]

# Same as Black.
line-length = 120

# Assume Python 3.14.
target-version = "py314"

# Format Jupyter notebooks
extend-include = ["*.ipynb"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"


[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
extend-select = ["D", "E", "F", "I", "UP"]

extend-ignore = [
    "D100",
    "D104",
    "D107",
    "D203",
    "D212",
    "D213",
    "D401",
    "D402",
    "D413",
    "D415",
    "D416",
    "D417",
    "E71",
    "E226",
    "E302",
    "E731",
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "EM", "ERA", "EXE", "FBT", "ICN", "INP", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "TRY", "UP", "YTT"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-line-length = 120
ignore-overlong-task-comments = true

[tool.isort]
known_first_party = 'docformatter'
known_third_party = ['toml']
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120

[tool.black]
line-length = 120
target-version = ['py314']
include = '\.pyi?$'
exclude = '''
/(
    \.git
| \.hg
| \.mypy_cache
| \.tox
| \.venv
| _build
| buck-out
| build
| \.pytest_cache
)/
'''

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-vv --cov='.'"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["tests/*"]
branch = true

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
    ]

ignore_errors = true

[tool.coverage.html]
directory = "coverage_html_report"

[tool.ty.src]
include = ["src", "tests"]
exclude = ["compose.yml", ".github", "migrations", "alembic", "database", "data", "*.json"]

[tool.ty.rules]
deprecated = "error"
redundant-cast = "error"
unknown-argument = "error"
inconsistent-mro = "error"
unresolved-import = "error"
not-subscriptable = "error"
index-out-of-bounds = "error"
unused-ignore-comment = "error"
invalid-method-override = "error"
possibly-missing-import = "error"
possibly-missing-attribute = "error"
invalid-return-type = "error"
invalid-argument-type = "error"
missing-typed-dict-key = "error"
