services:
  database:
    image: postgres:18-alpine
    container_name: postgresql
    hostname: postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hands-on-fastapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hands-on-fastapi}
      POSTGRES_DB: ${POSTGRES_DB:-todo_app}
    volumes:
        - postgres_data:/var/lib/postgresql/
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-hands-on-fastapi}", "-d", "${POSTGRES_DB:-todo_app}"]
      interval: 5s
      timeout: 10s
      retries: 3

  app:
    build:
        context: .
        dockerfile: dev.Dockerfile
    image: hands-on-fastapi
    container_name: hands-on-fastapi
    hostname: hands-on-fastapi
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-hands-on-fastapi}:${POSTGRES_PASSWORD:-hands-on-fastapi}@postgresql:5432/${POSTGRES_DB:-todo_app}
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
